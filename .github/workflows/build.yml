name: APK Oluşturucu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython setuptools

      - name: Buildozer ile APK Derle
        run: |
          buildozer -v android debug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Orman-Barkod-Uygulamasi-APK
          path: bin/*.apk
