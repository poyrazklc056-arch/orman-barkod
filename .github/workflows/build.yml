name: APK Oluşturucu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Buildozer Caches
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer

      - name: Build with Buildozer
        uses: ArtemSuldin/buildozer-action@v1
        with:
          command: buildozer -v android debug
          subfolder: .

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Orman-Barkod-Uygulamasi-APK
          path: bin/*.apk
